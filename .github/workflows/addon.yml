name: Home Assistant add-on images

# Publishes the per-architecture images referenced by loxone2shelly/config.yaml.
# Runs on version tags (v0.1.0) and can be triggered manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Read base image
        id: base
        run: |
          base=$(grep "^  ${{ matrix.arch }}:" loxone2shelly/build.yaml | sed -E 's/.*: *"?([^"]+)"?/\1/')
          echo "image=$base" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: loxone2shelly/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
          tags: |
            ghcr.io/aes-concepts-gmbh/loxone2shelly-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/aes-concepts-gmbh/loxone2shelly-${{ matrix.arch }}:latest
          labels: |
            io.hass.name=Loxone2Shelly Gateway
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
