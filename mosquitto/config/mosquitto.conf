# Development / trusted-LAN broker configuration.
# For production create a password file (mosquitto_passwd -c passwd <user>),
# set "allow_anonymous false" and "password_file /mosquitto/config/passwd".

listener 1883
listener 9001
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
