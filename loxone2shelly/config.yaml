name: "Loxone2Shelly Gateway"
description: "Gateway zur bidirektionalen Kommunikation zwischen Loxone Miniserver und Shelly-Geräten"
version: "0.1.1"
slug: loxone2shelly
url: "https://github.com/AES-Concepts-GmbH/loxone2shelly"
# Pre-built images (published by .github/workflows/addon.yml). Home Assistant
# pulls the image for the installed version instead of building locally.
image: "ghcr.io/aes-concepts-gmbh/loxone2shelly-{arch}"
arch:
  - aarch64
  - amd64
  - armv7
init: false
host_network: true
ingress: true
ingress_port: 8081
panel_icon: "mdi:home-automation"
panel_title: "Loxone2Shelly"
ports:
  8081/tcp: 8081
ports_description:
  8081/tcp: "Web UI & API"
map:
  - addon_config:rw
options:
  log_level: "info"
  api_token: ""
schema:
  log_level: "list(debug|info|warn|error)"
  api_token: "password?"
